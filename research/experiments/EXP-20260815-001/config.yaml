experiment:
  id: EXP-20260815-001
  hypothesis: H1
  universe: sample          # all_a | sample | list
  sample_size: 50           # sample 模式下随机抽取数量
  seed: 42
  start_date: "2014-01-01"
  end_date: "2024-12-31"
  split_date: "2022-12-31"  # 训练/测试切分点
  factor: mom_6_1
  rebalance: "M"            # 月度再平衡
  top_quantile: 0.2
  min_listed_days: 120
  max_holdings: 20
  min_price: 3.0
  max_price: 500.0
  exclude_st: true

data:
  source: akshare
  adjust: ""                # "" 不复权 / qfq / hfq
  cache_dir: data/cache
  retry: 3

costs:
  stamp_duty: 0.001         # 卖出印花税
  commission: 0.00025       # 双边佣金
  min_commission: 5.0
  slippage: 0.001           # 单边滑点
  transfer_fee: 0.00001     # 过户费

report_dir: experiments/EXP-20260815-001/results
